name: Daily NuGet Ranking

on:
  schedule:
    # Runs once per day at 02:17 UTC.
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: daily-nuget-ranking
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-ranking:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crawl NuGet ranking data
        run: python nugetrank.py

      - name: Generate NPOI ranking badge metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data_path = Path("data.json")
          if not data_path.exists():
              raise SystemExit("data.json was not generated by nugetrank.py.")

          data = json.loads(data_path.read_text(encoding="utf-8"))
          matches = [item for item in data if item.get("name") == "NPOI"]
          if not matches:
              raise SystemExit("NPOI package was not found in data.json (exact name match required).")
          if len(matches) > 1:
              raise SystemExit("Multiple exact NPOI entries found in data.json; unable to determine a unique ranking.")

          ranking = matches[0].get("ranking")
          if ranking is None:
              raise SystemExit("NPOI package does not contain a ranking field in data.json.")

          badge_payload = {
              "schemaVersion": 1,
              "label": "NPOI ranking",
              "message": f"#{ranking}",
              "color": "blue",
          }

          badge_path = Path(".github/badges/npoi-ranking.json")
          badge_path.parent.mkdir(parents=True, exist_ok=True)
          badge_path.write_text(json.dumps(badge_payload, indent=2) + "\n", encoding="utf-8")
          print(f"NPOI ranking: {ranking}")
          PY

      - name: Ensure README badge line exists
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          badge_line = "![NPOI Ranking](https://img.shields.io/endpoint?url=https%3A%2F%2Fraw.githubusercontent.com%2Ftonyqus%2Fnugetranking%2Fmain%2F.github%2Fbadges%2Fnpoi-ranking.json)"
          readme_path = Path("README.md")
          content = readme_path.read_text(encoding="utf-8")
          lines = content.splitlines()
          badge_pattern = re.compile(r"^!\[[^\]]*(?:NPOI|Nuget\s*Ranking)[^\]]*\]\([^)]+\)\s*$", re.IGNORECASE)

          if lines and badge_pattern.match(lines[0]):
              lines[0] = badge_line
          else:
              lines = [badge_line, ""] + lines

          updated = "\n".join(lines)
          if content.endswith("\n"):
              updated += "\n"

          if updated != content:
              readme_path.write_text(updated, encoding="utf-8")
          PY

      - name: Upload generated data artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-ranking-data
          path: data.json

      - name: Commit and push updates if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json .github/badges/npoi-ranking.json README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          base_sha="$(git ls-remote origin refs/heads/main | cut -f1)"

          git commit -m "Update NuGet ranking data and NPOI badge"
          if ! git push origin HEAD:main; then
            latest_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
            if [ "${latest_sha}" != "${base_sha}" ]; then
              echo "main moved from ${base_sha} to ${latest_sha}; skipping stale update."
              exit 0
            fi

            echo "Push failed for an unexpected reason."
            exit 1
          fi
