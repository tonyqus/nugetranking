name: Daily NuGet Ranking

on:
  schedule:
    # Runs once per day at 02:17 UTC.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ranking:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crawl NuGet ranking data
        run: python nugetrank.py

      - name: Generate NPOI ranking badge metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data_path = Path("data.json")
          if not data_path.exists():
              raise SystemExit("data.json was not generated by nugetrank.py.")

          data = json.loads(data_path.read_text(encoding="utf-8"))
          matches = [item for item in data if item.get("name") == "NPOI"]
          if not matches:
              raise SystemExit("NPOI package was not found in data.json (exact name match required).")
          if len(matches) > 1:
              raise SystemExit("Multiple exact NPOI entries found in data.json; unable to determine a unique ranking.")

          ranking = matches[0].get("ranking")
          if ranking is None:
              raise SystemExit("NPOI package does not contain a ranking field in data.json.")

          badge_payload = {
              "schemaVersion": 1,
              "label": "NPOI ranking",
              "message": f"#{ranking}",
              "color": "blue",
          }

          badge_path = Path(".github/badges/npoi-ranking.json")
          badge_path.parent.mkdir(parents=True, exist_ok=True)
          badge_path.write_text(json.dumps(badge_payload, indent=2) + "\n", encoding="utf-8")
          print(f"NPOI ranking: {ranking}")
          PY

      - name: Ensure README badge line exists
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          badge_line = "![NPOI Ranking](https://img.shields.io/endpoint?url=https%3A%2F%2Fraw.githubusercontent.com%2Ftonyqus%2Fnugetranking%2Fmain%2F.github%2Fbadges%2Fnpoi-ranking.json)"
          readme_path = Path("README.md")
          content = readme_path.read_text(encoding="utf-8")

          pattern = re.compile(r"!\[[^\]]*(?:NPOI|Nuget\s*Ranking)[^\]]*\]\([^)]+\)", re.IGNORECASE)
          updated, count = pattern.subn(badge_line, content, count=1)
          if count == 0:
              updated = f"{badge_line}\n\n{content.lstrip()}"

          if updated != content:
              readme_path.write_text(updated, encoding="utf-8")
          PY

      - name: Upload generated data artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-ranking-data
          path: data.json

      - name: Commit and push updates if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json .github/badges/npoi-ranking.json README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          current_branch="$(git rev-parse --abbrev-ref HEAD)"
          git commit -m "Update NuGet ranking data and NPOI badge"
          git pull --rebase origin "${current_branch}"
          git push origin "HEAD:${current_branch}"
